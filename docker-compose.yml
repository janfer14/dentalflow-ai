name: dentalflow-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: dentalflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentalflow
      POSTGRES_PASSWORD: dentalflow_dev_password
      POSTGRES_DB: dentalflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentalflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dentalflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:

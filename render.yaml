databases:
  - name: dentalflow-db
    plan: free
    databaseName: dentalflow
    user: dentalflow

services:
  - name: dentalflow-redis
    type: keyvalue
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (BullMQ connects from the backend service)
    maxmemoryPolicy: noeviction

  - name: dentalflow-backend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build:backend
    startCommand: cd apps/backend && npx prisma migrate deploy && npm run prisma:seed && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dentalflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dentalflow-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://dentalflow-frontend.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_PATIENT_ACCESS_SECRET
        generateValue: true
      - key: JWT_PATIENT_ACCESS_EXPIRES_IN
        value: 30d
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # Left unset on purpose — the app runs in sandbox mode for WhatsApp,
      # the AI assistant, and Google OAuth until these are filled in from
      # the Render dashboard (Environment tab). sync: false means Render
      # won't overwrite whatever value you set there on the next deploy.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://dentalflow-backend.onrender.com/api/v1/auth/google/callback

  - name: dentalflow-frontend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && NEXT_PUBLIC_API_URL=https://dentalflow-backend.onrender.com/api/v1 npm run build:frontend
    startCommand: cd apps/frontend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://dentalflow-backend.onrender.com/api/v1

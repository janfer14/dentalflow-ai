databases:
  - name: dentalflow-db
    plan: free
    databaseName: dentalflow
    user: dentalflow

services:
  - name: dentalflow-redis
    type: keyvalue
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: allow all (BullMQ connects from the backend service)
    maxmemoryPolicy: noeviction

  - name: dentalflow-backend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run prisma:generate && npm run build:backend
    startCommand: cd apps/backend && npx prisma migrate deploy && npm run prisma:seed && node dist/src/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dentalflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dentalflow-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://dentalflow-frontend.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_PATIENT_ACCESS_SECRET
        generateValue: true
      - key: JWT_PATIENT_ACCESS_EXPIRES_IN
        value: 30d
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_API_VERSION
        value: v21.0
      # WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_ACCESS_TOKEN, WHATSAPP_APP_SECRET,
      # ANTHROPIC_API_KEY, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET are
      # intentionally not listed here. Render's Blueprint create flow
      # requires a value for any env var it lists (even with sync: false),
      # so leaving them out entirely — rather than blank — is what actually
      # skips the prompt. The app already treats them as absent via `?? ''`
      # fallbacks and runs in sandbox mode. Add them later from the Render
      # dashboard's Environment tab once you have real credentials.
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: GOOGLE_CALLBACK_URL
        value: https://dentalflow-backend.onrender.com/api/v1/auth/google/callback

  - name: dentalflow-frontend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && NEXT_PUBLIC_API_URL=https://dentalflow-backend.onrender.com/api/v1 npm run build:frontend
    startCommand: cd apps/frontend && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://dentalflow-backend.onrender.com/api/v1
